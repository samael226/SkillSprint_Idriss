<!-- admin-dashboard.component.html -->
<div class="min-h-screen bg-gray-50">

  <!-- Main Content -->
  <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <!-- Admin Dashboard Header -->
    <div class="px-4 sm:px-0 flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Admin Dashboard</h1>
        <p class="mt-1 text-sm text-gray-500">Manage platform, users, and challenges</p>
      </div>
      <div class="flex space-x-3">

        <button class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-purple-600 hover:bg-purple-700">
          <svg class="mr-2 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
          Create Challenge
        </button>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 mb-6">
      <!-- Total Users Card -->
      <div class="bg-white overflow-hidden shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-sm font-medium text-gray-500 truncate">Active Hackathons </div>
              <div class="mt-1 text-3xl font-semibold text-gray-900">{{totalUsers}}</div>
              <div class="mt-1 text-sm text-green-600">{{userGrowth}}</div>
            </div>
            <div class="bg-gray-100 rounded-full p-3">
              <svg class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Active Challenges Card -->
      <div class="bg-white overflow-hidden shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-sm font-medium text-gray-500 truncate">Total Challenges</div>
              <div class="mt-1 text-3xl font-semibold text-gray-900">{{activeUsers}}</div>
              <div class="mt-1 text-sm text-green-600">{{activeGrowth}}</div>
            </div>
            <div class="bg-gray-100 rounded-full p-3">
              <svg class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Reported Issues Card -->
      <div class="bg-white overflow-hidden shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-sm font-medium text-gray-500 truncate">Total Participants</div>
              <div class="mt-1 text-3xl font-semibold text-gray-900">{{reportedIssues}}</div>
              <div class="mt-1 text-sm text-red-600">{{issuesChange}}</div>
            </div>
            <div class="bg-gray-100 rounded-full p-3">
              <svg class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="border-b border-gray-200 mb-6">
    <!-- Tabs -->
    <div class="border-b border-gray-200 mb-6">
      <nav class="-mb-px flex">
        <a (click)="setActiveTab('users')" class="cursor-pointer border-b-2" [class.border-gray-900]="activeTab === 'users'" [class.border-transparent]="activeTab !== 'users'" [class.text-gray-900]="activeTab === 'users'" [class.text-gray-500]="activeTab !== 'users'" class="py-4 px-1 text-sm font-medium mr-8 cursor-pointer">Users</a>
        <a (click)="setActiveTab('challenges')" class="cursor-pointer border-b-2" [class.border-gray-900]="activeTab === 'challenges'" [class.border-transparent]="activeTab !== 'challenges'" [class.text-gray-900]="activeTab === 'challenges'" [class.text-gray-500]="activeTab !== 'challenges'" class="py-4 px-1 text-sm font-medium mr-8 cursor-pointer">Challenges</a>
      </nav>
    </div>

    <!-- Content based on activeTab -->
    <app-users *ngIf="activeTab === 'users'"></app-users>
  </div>
</div>
