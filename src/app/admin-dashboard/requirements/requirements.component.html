<div class="max-w-3xl mx-auto px-4 py-10 bg-white rounded-2xl shadow-2xl">
  <!-- Challenge Requirements Section -->
  <div class="border border-indigo-100 rounded-2xl mb-8">
    <div class="px-6 py-4 border-b border-indigo-100">
      <h2 class="text-2xl font-bold text-indigo-800">Challenge Requirements</h2>
      <p class="text-sm text-indigo-500">Define critical requirements for your challenge</p>
    </div>
    <div class="px-6 py-4 border-b border-indigo-100">
      <div class="mb-4">
        <label class="block text-sm font-medium text-indigo-700 mb-1">Overview</label>
        <textarea 
          rows="3" 
          class="w-full px-3 py-2 border border-indigo-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-gray-400"
          placeholder="List the main objectives/components of your challenge"></textarea>
      </div>
    </div>
    <div class="px-6 py-4">
      <div class="flex justify-between mb-4">
        <h3 class="text-sm font-medium text-indigo-700">Requirements List</h3>
        <button 
          (click)="addRequirement()" 
          class="text-sm bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-lg px-4 py-2 shadow hover:from-indigo-700 hover:to-purple-700 flex items-center transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Add Requirement
        </button>
      </div>
      <div *ngFor="let req of requirements; let i = index" class="mb-4 bg-indigo-50 p-4 rounded-xl border border-indigo-200">
        <div class="flex justify-between mb-2 gap-2">
          <input 
            [(ngModel)]="req.title" 
            class="text-sm font-medium text-indigo-900 p-2 border border-indigo-200 rounded-lg w-full focus:ring-2 focus:ring-indigo-400 focus:outline-none placeholder-gray-400"
            placeholder="Requirement Title">
          <div class="flex items-center ml-2">
            <button class="text-red-500 hover:text-red-700 bg-white rounded-full p-2 shadow transition" (click)="deleteRequirement(i)">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
        <textarea 
          [(ngModel)]="req.description" 
          rows="3" 
          class="w-full px-3 py-2 border border-indigo-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-gray-400"
          placeholder="Describe this requirement in detail"></textarea>
      </div>
    </div>
  </div>
  <!-- Judging Criteria Section -->
  <div class="border border-indigo-100 rounded-2xl mb-8">
    <div class="px-6 py-4 border-b border-indigo-100">
      <h2 class="text-2xl font-bold text-indigo-800">Judging Criteria</h2>
      <p class="text-sm text-indigo-500">Define how submissions will be evaluated</p>
    </div>
    <div class="px-6 py-4">
      <div class="flex justify-between mb-4">
        <h3 class="text-sm font-medium text-indigo-700">Criteria List</h3>
        <button 
          (click)="addCriteria()" 
          class="text-sm bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-lg px-4 py-2 shadow hover:from-indigo-700 hover:to-purple-700 flex items-center transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Add Criteria
        </button>
      </div>
      <div *ngFor="let criterion of criteria; let i = index" class="mb-4 bg-indigo-50 p-4 rounded-xl border border-indigo-200">
        <div class="flex justify-between mb-2 gap-2">
          <input 
            [(ngModel)]="criterion.title" 
            class="text-sm font-medium text-indigo-900 p-2 border border-indigo-200 rounded-lg flex-grow mr-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none placeholder-gray-400"
            placeholder="Criterion Title">
          <div class="flex items-center">
            <input 
              [(ngModel)]="criterion.points" 
              type="number" 
              min="0" 
              max="100" 
              class="w-16 p-2 border border-indigo-200 rounded-lg text-center focus:ring-2 focus:ring-indigo-400 focus:outline-none placeholder-gray-400"
              placeholder="Points">
            <button class="ml-2 text-red-500 hover:text-red-700 bg-white rounded-full p-2 shadow transition" (click)="deleteCriteria(i)">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
        <textarea 
          [(ngModel)]="criterion.description" 
          rows="3" 
          class="w-full px-3 py-2 border border-indigo-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-gray-400"
          placeholder="Describe how this criterion will be evaluated"></textarea>
      </div>
    </div>
  </div>
  <!-- Submission Requirements Section -->
  <div class="border border-indigo-100 rounded-2xl mb-8">
    <div class="px-6 py-4 border-b border-indigo-100">
      <h2 class="text-2xl font-bold text-indigo-800">Submission Requirements</h2>
      <p class="text-sm text-indigo-500">Define what participants need to submit</p>
    </div>
    <div class="px-6 py-4">
      <div class="mb-4">
        <div class="flex items-center justify-between py-3 border-b border-indigo-100">
          <span class="font-medium text-indigo-900">GitHub Repository</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" [(ngModel)]="submissionOptions.githubRepository" class="sr-only peer">
            <div class="w-11 h-6 bg-indigo-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-indigo-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
          </label>
        </div>
        <div class="flex items-center justify-between py-3 border-b border-indigo-100">
          <span class="font-medium text-indigo-900">Deployment URL</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" [(ngModel)]="submissionOptions.deploymentURL" class="sr-only peer">
            <div class="w-11 h-6 bg-indigo-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-indigo-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
          </label>
        </div>
        <div class="flex items-center justify-between py-3 border-b border-indigo-100">
          <span class="font-medium text-indigo-900">Project Description</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" [(ngModel)]="submissionOptions.projectDescription" class="sr-only peer">
            <div class="w-11 h-6 bg-indigo-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-indigo-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
          </label>
        </div>
        <div class="flex items-center justify-between py-3 border-b border-indigo-100">
          <span class="font-medium text-indigo-900">Demo Video</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" [(ngModel)]="submissionOptions.demoVideo" class="sr-only peer">
            <div class="w-11 h-6 bg-indigo-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-indigo-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
          </label>
        </div>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-indigo-700 mb-1">Submission Instructions</label>
        <textarea 
          rows="4" 
          class="w-full px-3 py-2 border border-indigo-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 placeholder-gray-400"
          placeholder="Submit your solution by providing a GitHub repository URL, a deployment link where your application is hosted, and a detailed description of your solution including key features and technical decisions."></textarea>
      </div>
    </div>
  </div>
  <!-- Action Buttons -->
  <div class="flex justify-end space-x-3 px-6 pb-6">
    <button 
      (click)="cancelChanges()" 
      class="px-4 py-2 bg-white border border-indigo-200 text-indigo-700 rounded-lg hover:bg-indigo-50 transition">
      Cancel
    </button>
    <button 
      (click)="saveChanges()" 
      class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg shadow hover:from-indigo-700 hover:to-purple-700 transition">
      Publish Challenge
    </button>
  </div>
</div>
