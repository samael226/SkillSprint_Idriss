<div class="container mx-auto px-4 py-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-indigo-900">User Management</h1>
    
    <div class="flex space-x-2">
      <div class="relative">
        <input
          type="text"
          placeholder="Search Users"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearch()"
          class="pl-3 pr-10 py-2 border border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        />
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
          <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
      </div>
      
      <div class="relative">
        <button class="flex items-center space-x-2 px-4 py-2 border border-indigo-300 rounded-lg bg-white text-indigo-700 hover:bg-indigo-50 transition-colors duration-300">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
          </svg>
          <span>Filter</span>
        </button>
      </div>
    </div>
  </div>
  
  <div class="bg-white rounded-lg shadow-lg overflow-hidden border border-indigo-100">
    <table class="min-w-full divide-y divide-indigo-200">
      <thead class="bg-gradient-to-r from-indigo-700 to-purple-700">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">User</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Role</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Status</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Joined</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-indigo-100">
        <tr *ngIf="filteredUsers.length === 0" class="hover:bg-indigo-50 transition-colors duration-200">
          <td colspan="5" class="px-6 py-4 text-center text-gray-500">
            No users found matching your search criteria
          </td>
        </tr>
        <tr *ngFor="let user of filteredUsers" class="hover:bg-indigo-50 transition-colors duration-200">
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="flex-shrink-0 h-10 w-10">
                <div class="h-10 w-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-medium">
                  {{ user.name.charAt(0) }}
                </div>
              </div>
              <div class="ml-4">
                <div class="text-sm font-medium text-indigo-900">{{ user.name }}</div>
                <div class="text-sm text-indigo-500">{{ user.email }}</div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm text-indigo-700">{{ user.role }}</div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" [class]="getStatusClass(user.status)">
              {{ user.status }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-indigo-600">
            {{ user.joined }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button class="text-indigo-500 hover:text-indigo-700 transition-colors duration-200">
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"></path>
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    
    <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-indigo-200 sm:px-6">
      <div class="text-sm text-indigo-700">
        Showing 5 of {{totalUsers}} users
      </div>
      <div class="flex-1 flex justify-end">
        <button class="relative inline-flex items-center px-4 py-2 border border-indigo-300 text-sm font-medium rounded-md text-indigo-700 bg-white hover:bg-indigo-50 transition-colors duration-300 mr-3">
          Previous
        </button>
        <button class="relative inline-flex items-center px-4 py-2 border border-indigo-300 text-sm font-medium rounded-md text-indigo-700 bg-white hover:bg-indigo-50 transition-colors duration-300">
          Next
        </button>
      </div>
    </div>
  </div>
</div>
