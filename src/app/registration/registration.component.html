
<!-- signup.component.html -->
<div class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="flex flex-col lg:flex-row max-w-6xl w-full">
      <!-- Form Section -->
      <div class="w-full lg:w-1/2">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl text-center">
          <h2 class="text-white text-3xl font-bold mb-8">Sign up now </h2>
          
          <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
            <!-- Name fields -->
            <div class="flex flex-col md:flex-row gap-4 mb-4">
              <div class="flex-1">
                <input 
                  type="text" 
                  formControlName="firstName"
                  placeholder="First name" 
                  class="w-full px-4 py-2 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                  [ngClass]="{'border-red-500': signupForm.get('firstName')?.invalid && signupForm.get('firstName')?.touched}"
                />
                <div *ngIf="signupForm.get('firstName')?.invalid && signupForm.get('firstName')?.touched" 
                     class="text-red-500 text-left mt-1 text-sm">
                  First name is required
                </div>
              </div>
              <div class="flex-1">
                <input 
                  type="text" 
                  formControlName="lastName"
                  placeholder="Last name" 
                  class="w-full px-4 py-2 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                  [ngClass]="{'border-red-500': signupForm.get('lastName')?.invalid && signupForm.get('lastName')?.touched}"
                />
                <div *ngIf="signupForm.get('lastName')?.invalid && signupForm.get('lastName')?.touched" 
                     class="text-red-500 text-left mt-1 text-sm">
                  Last name is required
                </div>
              </div>
            </div>
            
            <!-- Email field -->
            <div class="mb-4">
              <input 
                type="email" 
                formControlName="email"
                placeholder="Email address" 
                class="w-full px-4 py-2 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                [ngClass]="{'border-red-500': signupForm.get('email')?.invalid && signupForm.get('email')?.touched}"
              />
              <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" 
                   class="text-red-500 text-left mt-1 text-sm">
                <span *ngIf="signupForm.get('email')?.errors?.['required']">Email is required</span>
                <span *ngIf="signupForm.get('email')?.errors?.['email']">Please enter a valid email</span>
              </div>
            </div>
            
            <!-- Password field -->
            <div class="mb-6" >
              <input 
                type="password" 
                formControlName="password"
                placeholder="Password" 
                class="w-full px-4 py-2 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                [ngClass]="{'border-red-500': signupForm.get('password')?.invalid && signupForm.get('password')?.touched}"
              />
              <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" 
                   class="text-red-500 text-left mt-1 text-sm">
                <span *ngIf="signupForm.get('password')?.errors?.['required']">Password is required</span>
                <span *ngIf="signupForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
              </div>
            </div>
            <div class="mb-6">
              <input 
                type="password" 
                formControlName="confirmPassword"
                placeholder="Confirm Password" 
                class="w-full px-4 py-2 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                [ngClass]="{'border-red-500': signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched}"
              />
              <div *ngIf="signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched" 
                   class="text-red-500 text-left mt-1 text-sm">
                <span *ngIf="signupForm.get('confirmPassword')?.errors?.['mismatch']">Passwords do not match</span>
              </div>
            </div>

            
            
            
            <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-300 mb-6">
            SIGN UP
          </button>
            
            <!-- Social sign up -->
            <div class="text-center mb-4">
              <a routerLink="/login"  class="text-gray-300 mb-4"> Im already a member</a>
              <div class="flex justify-center space-x-4">
                <!-- Facebook -->
                <a href="#" class="text-gray-400 hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/>
                  </svg>
                </a>
                
                <!-- Google -->
                <a href="#" class="text-gray-400 hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12.24 10.285v4.115h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.345-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138c-2.089-1.951-4.79-3.137-8.039-3.137-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989h-11.331z"/>
                  </svg>
                </a>
                
                <!-- Twitter -->
                <a href="#" class="text-gray-400 hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"/>
                  </svg>
                </a>
                
                <!-- GitHub -->
                <a href="#" class="text-gray-400 hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                  </svg>
                </a>
              </div>
            </div>
          </form>
        </div>
      </div>
      
      <!-- Image Section -->
      <div class="hidden lg:block w-1/2">
        <div class="h-full w-full relative">
          <img 
            src="html-css-collage-concept-with-person.jpg" 
            alt="Person taking photo on walkway" 
            class="w-full h-full object-cover rounded-r-lg"
          />
        </div>
      </div>
    </div>
  </div>
